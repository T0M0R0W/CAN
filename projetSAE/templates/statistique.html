<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../static/CSS/style.css">
    <link rel="stylesheet" href="../static/CSS/statistique.css">
    <link rel="icon" href="../static/logoNoText.png" type="image/png">
    <title>Statistiques</title>
</head>
<body>
    <header class="main-header">
        <a href="./index.html" class="logo-container" id="fig">
            <img src="../static/Can_cut.png" class="nav-logo" id="logo" alt="Logo CAN">
        </a>
        
        <nav class="main-nav">
            <a href="./tableau-bord.html">Tableau de Bord</a>
            <a href="./carte.html">Cartes</a> 
            <a href="./facture.html">Facture</a>
            <a href="./statistique.html">Statistiques</a>
        </nav>
    </header>
    
    <h1>Statistiques des Liaisons</h1>

    <div style="text-align: center; margin-bottom: 20px;">
        <button id="btn-load-stats">Charger les statistiques</button>
    </div>

    <main id="stats-container" class="conteneur-liaisons">
        </main>
    
    <template id="template-stat">
        <article class="stat-card">
            <h3 class="stat-titre">Nom Liaison</h3>
            <ul class="stat-list">
                <li>Passagers : <span class="stat-nb-pass">0</span> <span style="font-size:0.9em">pers.</span> (<span class="stat-ca-pass">0</span> €)</li>
                <li>Véhicules : <span class="stat-nb-veh">0</span> <span style="font-size:0.9em">unités</span> (<span class="stat-ca-veh">0</span> €)</li>
                <li style="margin-top:10px; border-top:1px solid #ccc; padding-top:5px;">
                    <strong>Total CA : <span class="stat-total">0</span> €</strong>
                </li>
            </ul>
        </article>
    </template>

    <script src="../static/JS/statistique.js"></script> </body>
</html>
